name: plantoo
description: A Flutter plant e-commerce and plant-care app with glassmorphism design.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  lucide_icons: ^0.257.0
  flutter_launcher_icons: ^0.13.1
  http: ^1.1.0
  shared_preferences: ^2.2.2
  razorpay_flutter: ^1.3.0
  flutter_secure_storage: ^9.0.0
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#1a1a2e"
  adaptive_icon_foreground: "assets/images/logo.png"
